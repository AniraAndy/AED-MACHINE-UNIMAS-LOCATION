<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>AED MACHINE LOCATOR UNIMAS</title>
  
  <!-- THIS IS THE NEW LINE FOR YOUR TAB LOGO -->
  <link rel="icon" type="image/jpeg" href="images/AED_Logo_USA.jpg">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- 1. The Map Background -->
  <div id="map-container"></div>

  <!-- 2. Functional Search Bar -->
  <div class="top-search-bar">
    <div class="search-input-container">
      <span class="icon">📍</span>
      <input type="text" id="search-box" placeholder="Search building or AED...">
    </div>
  </div>

  <!-- 3. Dynamic Swipeable AED Cards (Populated by app.js) -->
  <div class="card-carousel" id="card-container">
    <!-- Cards will be injected here automatically -->
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
